[project]
name = "diting-dataset"
version = "0.1.0"
description = "DiTing Dataset Module"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diting-core",
    "nest-asyncio"
]

[project.optional-dependencies]
all = [
    "datasets>=3.6.0",  # Hugging Face数据集支持
    "tiktoken",  # 令牌计数工具
    "rapidfuzz",  # 模糊匹配/字符串相似度计算
    "rjieba>=0.1.13", # 中文分词
    "unstructured[md]>=0.17.2",  # 非结构化文本处理（markdown支持）
    "langchain-community>=0.3.24",  # LangChain生态集成
]
# Hugging Face数据集交互依赖
hf = [
    "datasets>=3.6.0",
]
# 文本处理工具依赖
docs-gen = [
    "tiktoken",
    "langchain-community>=0.3.24",
    "rapidfuzz",
    "rjieba>=0.1.13",
    "unstructured[md]>=0.17.2",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.hatch.build.targets.wheel]
packages = ["src/diting_dataset"]
