# 执行配置
execution:
  execution_mode: "sequential"  # sequential: 串行, parallel: 并发, batch: 批量
  max_workers: 2
  save_reports: true
  report_dir: "reports"
  report_format: "markdown"  # markdown, json, html
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  verbose_http: false  # 是否显示HTTP请求日志