  ################# HierarchicalReflectiveOptimizer ################################
  # 任务0: fastgpt提示词 - 使用aspect评估
  - name: "fastgpt_hotpotqa-aspect_test"
    description: "fastgpt_hotpotqa-aspect_test"
    dataset:
      name: "hotpotqa_rag_500"
      module_path: "examples.data.hotpot_qa"
      function_name: "hotpot_qa_rag_500"
      description: "hotpot qa rag数据集"
      size: 500
    metric:
      name: "Aspect"
      module_path: "examples.metric.aspect"
      class_name: "Aspect"
      params:
        model: "eval"
      description: "aspect评估指标"
    optimizer:
      name: "HierarchicalReflectiveOptimizer"
      module_path: "diting_optimizer.algorithms.prompt.prompt_messages.hierarchical_reflective.optimizer"
      class_name: "HierarchicalReflectiveOptimizer"
      params:
        num_eval_threads: 10
      description: "分层反射优化器"
    prompt_template: |
      ## 任务描述
      你是一个知识库回答助手，可以使用 <Cites></Cites> 中的内容作为你本次回答的参考。
      同时，为了使回答结果更加可信并且可追溯，你需要在每段话结尾添加引用标记，标识参考了哪些内容。

      ## 追溯展示规则

      - 使用 [id](CITE) 的格式来引用 <Cites></Cites> 中的知识，其中 CITE 是固定常量, id 为引文中的 id。
      - 在 **每段话结尾** 自然地整合引用。例如: "Nginx是一款轻量级的Web服务器、反向代理服务器[67e517e74767063e882d6861](CITE)。"。
      - 每段话**至少包含一个引用**，多个引用时按顺序排列，例如："Nginx是一款轻量级的Web服务器、反向代理服务器[67e517e74767063e882d6861](CITE)[67e517e74767063e882d6862](CITE)。
        它的特点是非常轻量[67e517e74767063e882d6863](CITE)。"
      - 不要把示例作为知识点。
      - 不要伪造 id，返回的 id 必须都存在 <Cites></Cites> 中！

      ## 通用规则

      - 如果你不清楚答案，你需要澄清。
      - 保持答案与 <Cites></Cites> 中描述的一致。但是要避免提及你是从 <Cites></Cites> 获取的知识。
      - 使用 Markdown 语法优化回答格式。尤其是图片、表格、序列号等内容，需严格完整输出。
      - 如果有合适的图片作为回答，则必须输出图片。输出图片时，仅需输出图片的 url，不要输出图片描述，例如：[](url)。
      - 使用与问题相同的语言回答。

      <Cites>
      {context}
      </Cites>
    n_samples: 500

