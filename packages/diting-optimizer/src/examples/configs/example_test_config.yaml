  # 任务3: Hotpot QA - 使用准确性评估
  - name: "hotpot_accuracy_test"
    description: "Hotpot QA数据集使用准确性指标测试"
    dataset:
      name: "hotpot_300"
      module_path: "diting_optimizer.datasets.hotpot_qa"
      function_name: "hotpot_300"
      description: "Hotpot问答数据集"
      size: 300
    metric:
      name: "AccuracyAndConciseMetric"
      module_path: "examples.metric.accuracy_metric"
      class_name: "AccuracyAndConciseMetric"
      params:
        model: "eval"
      description: "准确性和简洁性评估指标"
    optimizer:
      name: "HierarchicalReflectiveOptimizer"
      module_path: "diting_optimizer.algorithms.prompt.prompt_messages.hierarchical_reflective.optimizer"
      class_name: "HierarchicalReflectiveOptimizer"
      params:
        num_eval_threads: 20
      description: "分层反射优化器"
    prompt_template: "Provide an answer to the question"
    n_samples: 1

  - name: "hotpot_correctness_test"
    description: "Hotpot QA数据集使用准确性指标测试"
    dataset:
      name: "hotpot_300"
      module_path: "diting_optimizer.datasets.hotpot_qa"
      function_name: "hotpot_300"
      description: "Hotpot问答数据集"
      size: 300
    metric:
      name: "AnswerCorrectness"
      module_path: "diting_core.metrics"
      class_name: "AnswerCorrectness"
      params:
        model: "eval"
        embedding_model: "embedding"
      description: "答案正确性评估指标"
    optimizer:
      name: "HierarchicalReflectiveOptimizer"
      module_path: "diting_optimizer.algorithms.prompt.prompt_messages.hierarchical_reflective.optimizer"
      class_name: "HierarchicalReflectiveOptimizer"
      params:
        num_eval_threads: 20
      description: "分层反射优化器"
    prompt_template: "Provide an answer to the question"
    n_samples: 1

# 执行配置
execution:
  execution_mode: "sequential"  # sequential: 串行, parallel: 并发, batch: 批量
  max_workers: 2
  save_reports: true
  report_dir: "reports"
  report_format: "markdown"  # markdown, json, html
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  verbose_http: false  # 是否显示HTTP请求日志