version: '3.8'

# 开发环境 - 仅基础设施组件
# 用于本地调试 diting-web，不包含 diting-web 本身

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: diting-dev-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diting_web
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diting-dev
    restart: unless-stopped

  # Redis 缓存和队列
  redis:
    image: redis:7-alpine
    container_name: diting-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diting-dev
    restart: unless-stopped

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: diting-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API 端口
      - "9001:9001"   # 控制台端口
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - diting-dev
    restart: unless-stopped

networks:
  diting-dev:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

