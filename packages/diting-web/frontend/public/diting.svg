<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- 背景多色渐变：青色 → 靛蓝 → 紫色 → 粉紫 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D946EF;stop-opacity:1" />
    </linearGradient>

    <!-- 内核渐变：偏亮、带一点青色高光 -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#99F6E4;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#C7D2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9D5FF;stop-opacity:1" />
    </linearGradient>

    <!-- 外圈描边渐变 -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:0.6" />
    </linearGradient>

    <!-- 顶左与底右的氛围光 -->
    <radialGradient id="ambientGlowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="ambientGlowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0F9FF;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="centerGlow">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.85" />
      <stop offset="70%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- 背景圆角方形 -->
  <rect x="10" y="10" width="180" height="180" rx="28" ry="28" fill="url(#bgGrad)"/>
  <!-- 边缘高光描边 -->
  <rect x="11.5" y="11.5" width="177" height="177" rx="26.5" ry="26.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <!-- 顶左与底右的氛围光覆层 -->
  <circle cx="58" cy="42" r="52" fill="url(#ambientGlowTL)"/>
  <circle cx="158" cy="158" r="60" fill="url(#ambientGlowBR)"/>

  <!-- 洞察之眼的外圈 - 代表全面评估 -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- 中心光芒效果 -->
  <circle cx="100" cy="100" r="45" fill="url(#centerGlow)"/>

  <!-- 核心图形：抽象的洞察符号（雷达扫描） -->
  <g transform="translate(100, 100)">
    <!-- 中心核心 -->
    <circle cx="0" cy="0" r="20" fill="url(#innerGrad)" opacity="0.9"/>

    <!-- 三条扫描线（120度分布，代表全方位评估） -->
    <line x1="0" y1="0" x2="0" y2="-40" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="0" y1="0" x2="34.64" y2="20" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="0" y1="0" x2="-34.64" y2="20" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- 端点装饰 -->
    <circle cx="0" cy="-40" r="4" fill="white" opacity="0.95"/>
    <circle cx="34.64" cy="20" r="4" fill="white" opacity="0.95"/>
    <circle cx="-34.64" cy="20" r="4" fill="white" opacity="0.95"/>

    <!-- 中心亮点 -->
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.98"/>
  </g>

  <!-- 外围数据点（代表AI分析的数据节点） -->
  <circle cx="100" cy="35" r="3.5" fill="white" opacity="0.7"/>
  <circle cx="145" cy="60" r="3" fill="white" opacity="0.6"/>
  <circle cx="160" cy="100" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="145" cy="140" r="3" fill="white" opacity="0.6"/>
  <circle cx="100" cy="165" r="3.5" fill="white" opacity="0.7"/>
  <circle cx="55" cy="140" r="3" fill="white" opacity="0.6"/>
  <circle cx="40" cy="100" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="55" cy="60" r="3" fill="white" opacity="0.6"/>

  <!-- 动态弧线装饰 -->
  <path d="M 70 45 Q 100 35, 130 45" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 70 155 Q 100 165, 130 155" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>


