[project]
name = "diting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diting"]


[tool.uv]
index-url = "http://mirrors.sangfor.org/pypi/simple/"

[dependency-groups]
dev = [
    "coverage>=7.9.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
]
lint = [
    "mypy>=1.16.1",
    "pyright>=1.1.402",
    "ruff>=0.12.1",
]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.11"
mypy_path = "./src"
explicit_package_bases = true
exclude = [
  "tests/",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[tool.coverage.run]
include = [
    "src/**/*.py",
    "tests/**/*.py",
]
branch = true

# https://coverage.readthedocs.io/en/latest/config.html#report
[tool.coverage.report]
skip_covered = true
show_missing = true
ignore_errors = true
precision = 2
exclude_lines = [
    # `# pragma: no cover` is standard marker for code that's not covered, this will error if code is covered
    'pragma: no cover',
    # use `# pragma: lax no cover` if you want to ignore cases where (some of) the code is covered
    'pragma: lax no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'if typing.TYPE_CHECKING:',
    '@overload',
    '@deprecated',
    '@typing.overload',
    '@abstractmethod',
    '\(Protocol\):$',
    'typing.assert_never',
    '$\s*assert_never\(',
    'if __name__ == .__main__.:',
    'except ImportError as _import_error:',
    '$\s*pass$',
    'assert False',
]
