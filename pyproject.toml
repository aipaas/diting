[project]
name = "diting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diting"]


[tool.uv]
index-url = "http://mirrors.sangfor.org/pypi/simple/"

[dependency-groups]
dev = [
    "coverage>=7.9.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
]
lint = [
    "mypy>=1.16.1",
    "pyright>=1.1.402",
    "ruff>=0.12.1",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.11"
mypy_path = "./src"
explicit_package_bases = true
exclude = [
  "tests/",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
